<!doctype html>
<html lang="en" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>RTL fixtures</title>
  <link rel="stylesheet" href="../../src/combobox.css">
</head>
<body>
  <label for="rtl-multi">ארוחת צוהריים</label>
  <select id="rtl-multi" name="rtl-multi[]" multiple>
    <option value="1" selected>חומוס</option>
    <option value="2" selected>פלאפל</option>
    <option value="3">סלט</option>
  </select>

  <label for="rtl-single">עיר</label>
  <select id="rtl-single" name="rtl-single">
    <option value="">בחר</option>
    <option value="t">תל אביב</option>
    <option value="j">ירושלים</option>
  </select>

  <script type="module" src="../../src/define.js"></script>
</body>
</html>
