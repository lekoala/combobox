name: CI

on:
  push:
  pull_request:

jobs:
  # Fast Chromium-only loop on every push and PR.
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:syntax
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run build
      - run: bun run test:browser:chromium
      - run: bun run test:dist

  # Full Firefox + WebKit matrix on the release path (master + tags) only;
  # the reference engines run the source suite and the generated bundle.
  matrix:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install
      - run: bunx playwright install --with-deps firefox webkit
      - run: bun run test:syntax
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run build
      - run: bun run test:matrix