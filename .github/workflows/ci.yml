name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run verify

  browser:
    runs-on: ubuntu-latest
    needs: quality
    # Each shard keeps the 4 workers the config allows for stability and works
    # on its own 4 vCPU runner, so sharding cuts wall time without raising
    # per-job parallelism (which produced protocol flakes above 4 workers).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Pin to the Playwright release that matches @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run sync
      - name: Browser behavior suite (${{ matrix.shard }}/3)
        run: bun run test:browser:all --shard=${{ matrix.shard }}/3
      # The dist smoke build is independent of sharding; run it once.
      - name: Dist smoke
        if: matrix.shard == 1
        run: bun run test:dist
